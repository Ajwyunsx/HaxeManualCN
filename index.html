<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Document</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Description">
  <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <!-- MDUI CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mdui@1.0.2/dist/css/mdui.min.css" />
  <!-- Docsify with MDUI theme -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify/lib/themes/vue.css">
  <style>
    /* 自定义样式以适配MDUI */
    .sidebar {
      background-color: #f5f5f5 !important;
    }
    .content {
      padding-top: 64px !important;
    }
    .markdown-section {
      max-width: 1200px;
      margin: 0 auto;
      padding: 30px 15px;
    }
    body {
      background-color: #fafafa;
    }
    /* 搜索框样式 */
    .search {
      margin: 0 15px;
    }
    .search input {
      background-color: rgba(255, 255, 255, 0.2);
      color: white;
      border: none;
      border-radius: 4px;
      padding: 8px 12px;
      width: 200px;
    }
    .search input::placeholder {
      color: rgba(255, 255, 255, 0.7);
    }
    .search-results {
      background-color: white;
      border-radius: 4px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <!-- MDUI App Bar -->
  <div class="mdui-appbar mdui-appbar-fixed">
    <div class="mdui-toolbar mdui-color-indigo">
      <a href="javascript:;" class="mdui-typo-title">Haxe 4 中文手册</a>
      <div class="mdui-toolbar-spacer"></div>
      <!-- 搜索框 -->
      <div class="search">
        <input type="text" placeholder="搜索文档..." id="search-input">
      </div>
      <a href="https://github.com/NulllStack/HaxeManualCN" target="_blank" class="mdui-btn mdui-btn-icon">
        <i class="mdui-icon material-icons">code</i>
      </a>
    </div>
  </div>
  
  <div id="app"></div>
  <script>
    window.$docsify = {
      coverpage: true,
      auto2top: true,
      loadSidebar: true,
      subMaxLevel: 1,
      name: 'Haxe 4 中文手册',
      repo: 'https://github.com/NulllStack/HaxeManualCN',
      themeColor: '#3f51b5',
      // 搜索配置
      search: {
        maxAge: 86400000, // 过期时间，单位毫秒，默认一天
        paths: 'auto', // 或者 'auto'
        placeholder: '搜索文档...',
        noData: '找不到结果',
        // 搜索标题的最大层级, 1 - 6
        depth: 2,
        hideOtherSidebarContent: false, // 是否隐藏其他侧边栏内容
        namespace: 'HaxeManualCN', // 避免多站点之间的搜索冲突
      }
    }
  </script>
  <!-- MDUI JS -->
  <script src="https://cdn.jsdelivr.net/npm/mdui@1.0.2/dist/js/mdui.min.js"></script>
  <!-- Docsify JS -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/docsify.min.js"></script>
  <!-- Docsify 搜索插件 -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-javascript.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-haxe.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-cpp.min.js"></script>
  
  <script>
    // 初始化MDUI组件
    document.addEventListener('DOMContentLoaded', function() {\      // 初始化搜索功能
      const searchInput = document.getElementById('search-input');
      if (searchInput) {
        searchInput.addEventListener('keyup', function(e) {
          if (e.key === 'Enter') {
            const searchTerm = this.value.trim();
            if (searchTerm) {
              // 触发docsify搜索
              const searchEvent = new Event('input', { bubbles: true });
              this.dispatchEvent(searchEvent);
            }
          }
        });
      }
    });
  </script>
</body>
</html>
